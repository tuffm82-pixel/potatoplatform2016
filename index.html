<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172b2b"><title>Potato Man · Spud Sprint</title><link rel="stylesheet" href="style.css"></head><body>
<div id="game-shell"><canvas id="game" width="1600" height="900" aria-label="Three-lane Potato Man runner. Left and right change lanes, Space jumps, Down slides, E activates power, Escape pauses." tabindex="0"></canvas>
<div id="hud" class="hidden"><div class="hud-left"><button id="pause" aria-label="Pause">Ⅱ</button><span class="score-label">DISTANCE<strong id="distance">00000 m</strong></span></div><div class="hud-right"><span id="hearts">♥ ♥ ♥</span><span class="coin-counter">✦ <b id="coins">0</b><small id="wallet-run">BANK 0</small></span><button id="power" aria-label="Activate hero power">ϟ <span id="power-label">READY</span></button></div></div>
<div id="menu" class="screen"><div class="menu-top"><span class="game-badge">POTATO MAN’S NEXT ADVENTURE</span><div class="menu-tools"><span class="wallet-badge">🪙 <b id="bank">0</b> COINS</span><button id="sound" class="round" aria-label="Toggle sound">♪ OFF</button><button id="fullscreen" class="round" aria-label="Fullscreen">⛶</button></div></div><div class="title-block"><div class="mini-title">POTATO MAN</div><h1>SPUD<br><span>SPRINT!</span></h1><p>Big color. Real 3D heroes. Earn your dream crew.</p><button id="play" class="run-button">LET’S RUN <span>▶</span></button><div id="equipped"></div><div class="best">PERSONAL BEST <b id="best">0 m</b></div></div><div class="hero-caption"><span id="hero-tag">3D RUNNER · EQUIPPED</span><b id="selected-name">POTATO MAN</b><small id="selected-power">Fly Form</small><button id="unlock" class="unlock-button hidden">UNLOCK</button><span id="unlock-note">Ready to run</span></div><div class="bottom-menu"><div class="crew"><span class="crew-label">CHOOSE YOUR RUNNER</span><div id="hero-list"></div></div><div class="control-guide"><span><kbd>← →</kbd> SWITCH LANES</span><span><kbd>SPACE</kbd> JUMP</span><span><kbd>↓</kbd> SLIDE</span><span><kbd>E</kbd> POWER</span></div></div></div>
<div id="overlay" class="screen hidden"><div class="result"><p id="result-kicker">TAKE A BREATHER</p><h2 id="result-title">PAUSED</h2><p id="result-message"></p><button id="resume" class="run-button">KEEP RUNNING ▶</button><button id="home" class="text-button">BACK TO MENU</button></div></div>
<div id="touch" class="hidden"><button data-action="left" aria-label="Left lane">◀</button><button data-action="right" aria-label="Right lane">▶</button><div></div><button data-action="slide" aria-label="Slide">↓</button><button data-action="jump" aria-label="Jump">↑</button></div><div id="toast" class="hidden"></div>
</div><script src="three.min.js"></script><script src="core.js"></script><script src="wallet.js"></script><script src="renderer3d.js"></script><script src="app.js"></script></body></html>
